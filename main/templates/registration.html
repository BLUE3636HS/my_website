<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>新規登録 | 工作室テクネ</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap">
        <link rel="stylesheet" href="/static/student/theme.css">
        <link rel="stylesheet" href="/static/student/auth.css?v=logo-1">
        <link rel="icon" href="/static/icon.ico">
    </head>
    <body class="auth-body">
        <header class="auth-top">
            <a class="auth-brand-logo" href="/login" aria-label="TEKNE KeyNote ログインへ">
                <img src="/static/top-logo.png" alt="TEKNE KeyNote" width="330" height="160">
            </a>
        </header>
        <main class="auth-stage auth-stage-register">
        <h1 class="auth-title">新規登録</h1>
        <p class="auth-subtitle">登録には学校IDが必要です。</p>
        <section class="registration-page student-mode auth-card auth-card-wide">
            <div id="tab" class="auth-tabs" role="group" aria-label="登録の種類">
                <button type="button" id="student_form_btn" class="active" aria-selected="true">生徒用</button>
                <button type="button" id="teacher_form_btn" aria-selected="false">先生用</button>
            </div>
            <div id="student_form" class="auth-form">
                <h2>生徒用会員登録</h2>
                <form id="school_registration_form">
                    <label for="school_student_name">名前</label>
                    <input type="text" id="school_student_name" autocomplete="name" maxlength="80" pattern="\S{1,80}" required>
                    <em>漢字・ひらがな・カタカナで入力してください（スペースなし）</em>

                    <label for="school_student_furigana">フリガナ</label>
                    <input type="text" id="school_student_furigana" autocomplete="off" maxlength="80" pattern="\S{1,80}" required>
                    <em>カタカナで入力してください（スペースなし）</em>

                    <label for="school_student_id">ID</label>
                    <input type="text" id="school_student_id" autocomplete="username" maxlength="128" required>
                    <em>8文字以上の半角英数字、記号も可</em>

                    <label for="school_student_pwd">パスワード</label>
                    <input type="password" id="school_student_pwd" autocomplete="new-password" maxlength="128" required>
                    <em>8文字以上、半角英字と数字を含めてください</em>

                    <label for="school_id">学校ID</label>
                    <input type="password" id="school_id" autocomplete="off" maxlength="6" minlength="6" pattern="[A-HJ-NP-Z2-9]{6}" required>
                    <em>6文字の学校IDを入力してください</em>
                    <button type="submit" class="auth-submit">生徒登録</button>
                </form>
                <p id="school_registration_message" role="status" aria-live="polite"></p>
            </div>
            <div id="teacher_form" class="auth-form">
                <h2>先生用会員登録</h2>
                <form id="teacher_registration_form">
                    <label for="teacher_id">ID</label>
                    <input type="text" id="teacher_id" autocomplete="username" maxlength="128" required>
                    <em>8文字以上の半角英数字、記号も可</em>

                    <label for="teacher_pwd">パスワード</label>
                    <input type="password" id="teacher_pwd" autocomplete="new-password" maxlength="72" required>
                    <em>8文字以上、半角英字と数字を含めてください</em>

                    <label for="teacher_school_id">学校ID</label>
                    <input type="password" id="teacher_school_id" autocomplete="off" maxlength="6" minlength="6" pattern="[A-HJ-NP-Z2-9]{6}" required>
                    <button type="submit" class="auth-submit">先生登録</button>
                </form>
                <p id="teacher_registration_message" role="status" aria-live="polite"></p>
            </div>
        </section>
        <div class="auth-illustration" aria-hidden="true"></div>
        </main>
        <nav class="auth-ground" aria-label="ログインへ戻る">
            <a class="auth-ground-button" href="/login">ログインに戻る</a>
        </nav>
        <script src="/static/registration.js"></script>
        <script src="/static/school_registration.js"></script>
    </body>
</html>
