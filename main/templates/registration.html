<!DOCTYPE html>
<html>
    <head>
        <title>
            新規会員登録ページ
        </title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/static/base.css">
        <link rel="icon" href="/static/icon.ico">
        <link rel="stylesheet" href="/static/registration.css">
    </head>
    <body>
        <main class="registration-page student-mode">
            <div id="tab">
                <button type="button" id="student_form_btn" class="active" aria-selected="true">生徒用</button>
                <button type="button" id="teacher_form_btn" aria-selected="false">先生用</button>
            </div>
            <div id="student_form">
                <h2>生徒用会員登録</h2>
                <form id="school_registration_form">
                    <label for="school_student_id">ID</label>
                    <input type="text" id="school_student_id" autocomplete="username" maxlength="128" required>
                    <em>8文字以上の半角英数字、記号も可</em>

                    <label for="school_student_pwd">パスワード</label>
                    <input type="password" id="school_student_pwd" autocomplete="new-password" maxlength="128" required>
                    <em>8文字以上、半角英字と数字を含めてください</em>

                    <label for="school_id">学校ID</label>
                    <input type="password" id="school_id" autocomplete="off" maxlength="6" minlength="6" pattern="[A-HJ-NP-Z2-9]{6}" required>
                    <button type="submit">生徒登録</button>
                </form>
                <p id="school_registration_message" role="status" aria-live="polite"></p>
            </div>
            <div id="teacher_form">
                <h2>先生用会員登録</h2>
                <form id="teacher_registration_form">
                    <label for="teacher_id">ID</label>
                    <input type="text" id="teacher_id" autocomplete="username" maxlength="128" required>
                    <em>8文字以上の半角英数字、記号も可</em>

                    <label for="teacher_pwd">パスワード</label>
                    <input type="password" id="teacher_pwd" autocomplete="new-password" maxlength="72" required>
                    <em>8文字以上、半角英字と数字を含めてください</em>

                    <label for="teacher_school_id">学校ID</label>
                    <input type="password" id="teacher_school_id" autocomplete="off" maxlength="6" minlength="6" pattern="[A-HJ-NP-Z2-9]{6}" required>
                    <button type="submit">先生登録</button>
                </form>
                <p id="teacher_registration_message" role="status" aria-live="polite"></p>
            </div>
            <a href="/login">ログインに戻る</a>
        </main>
        <script src="/static/registration.js"></script>
        <script src="/static/school_registration.js"></script>
    </body>
</html>
