{% extends "teacher/base.html" %}
{% block title %}自校の機能設定{% endblock %}
{% block content %}
<div class="teacher-page teacher-school-features-page">
    <section class="teacher-dashboard-card">
        <p class="teacher-eyebrow">School Features</p>
        <h1>自校の機能設定</h1>
        <p>{{ school }}の生徒画面で利用できる機能を設定します。無効にした機能は関連ページやAPIも利用できなくなります。</p>
        {% if notice %}<p class="teacher-field-notice teacher-field-notice-success" role="status">{{ notice }}</p>{% endif %}
        <form method="post" action="/teacher/school-features" class="teacher-school-features-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <ul class="teacher-school-features-list">
                {% for key, label in features %}
                <li><label><span>{{ label }}</span><input type="checkbox" name="enabled:{{ key }}" value="1"{% if settings[key] %} checked{% endif %}><span class="teacher-feature-switch" aria-hidden="true"></span></label></li>
                {% endfor %}
            </ul>
            <button type="submit">設定を保存</button>
        </form>
    </section>
</div>
{% endblock %}
