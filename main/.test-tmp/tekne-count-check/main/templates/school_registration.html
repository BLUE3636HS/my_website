<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>学校用会員登録</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/static/base.css">
        <link rel="icon" href="/static/icon.ico">
        <link rel="stylesheet" href="/static/registration.css">
    </head>
    <body>
        <main>
            <h2>学校用会員登録</h2>
            <form id="school_registration_form">
                <label for="school_student_id">ID</label>
                <input type="text" id="school_student_id" autocomplete="username" maxlength="128" required>
                <em>8文字以上の半角英数字、記号も可</em>

                <label for="school_student_pwd">パスワード</label>
                <input type="password" id="school_student_pwd" autocomplete="new-password" maxlength="128" required>
                <em>8文字以上、半角英字と数字を含めてください</em>

                <label for="school_id">学校ID</label>
                <input type="password" id="school_id" autocomplete="off" maxlength="6" minlength="6" pattern="[A-HJ-NP-Z2-9]{6}" required>
                <button type="submit">生徒登録</button>
            </form>
            <p id="school_registration_message" role="status" aria-live="polite"></p>
            <a href="/registration">一般用会員登録はこちら</a>
            <a href="/login">ログインに戻る</a>
        </main>
        <script src="/static/school_registration.js"></script>
    </body>
</html>
