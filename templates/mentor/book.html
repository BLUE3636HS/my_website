{% extends "base.html" %}{% block title %}{{ mentor.display_name }}を予約{% endblock %}{% block css %}<link rel="stylesheet" href="/static/mentor.css">{% endblock %}
{% block content %}<div class="mentor-page"><header class="mentor-hero"><p class="eyebrow">BOOK A MENTOR</p><h1>{{ mentor.display_name }}を予約</h1><p>利用形式と日付を選び、空いている連続時間を指定してください。</p></header><div id="mentor-book-error" class="mentor-notice is-error" hidden></div><form id="mentor-book-form" class="mentor-panel mentor-form" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}">
<fieldset><legend>利用形式</legend><label class="mentor-check"><input type="radio" name="meeting_type" value="online" checked>オンライン</label><label class="mentor-check"><input type="radio" name="meeting_type" value="offline">オフライン</label></fieldset><label>日付<input type="date" name="day" min="{{ tomorrow }}" value="{{ tomorrow }}" required></label><button type="button" class="mentor-secondary" id="mentor-load-slots">空き時間を確認</button>
<div class="mentor-grid"><label>開始<select name="start_time" required disabled></select></label><label>終了<select name="end_time" required disabled></select></label></div><p id="mentor-slot-help">日付と利用形式を選び、空き時間を確認してください。</p><label>相談内容<textarea name="consultation" maxlength="2000" required rows="6"></textarea></label><button class="mentor-button" type="submit" disabled>予約を確定する</button></form></div>{% endblock %}
{% block script %}<script src="/static/mentor_booking.js"></script>{% endblock %}
