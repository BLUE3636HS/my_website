{% extends "base.html" %}
{% block title %}通知詳細{% endblock %}
{% block css %}<link rel="stylesheet" href="/static/notifications.css">{% endblock %}
{% block content %}
<div class="student-page student-page-narrow notification-page">
    <a class="notification-back" href="/notifications">← 通知一覧へ戻る</a>
    <article class="student-panel notification-detail">
        <div class="notification-item-head"><h1>{{ notification.title }}</h1><span>既読</span></div>
        <p class="notification-meta">送信元: {{ notification.sender_name }}　{{ notification.created_at }}</p>
        <div class="notification-body">{{ notification.body }}</div>
    </article>
</div>
{% endblock %}
