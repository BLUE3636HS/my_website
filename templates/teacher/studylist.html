{% extends "teacher/base.html" %}
{% block title %}自校提出物確認{% endblock %}
{% block css %}
    <link rel="stylesheet" href="/static/teacher/studylist.css">
{% endblock %}
{% block content %}
<div class="teacher-page teacher-studylist-page">
    <section class="teacher-studylist-card">
    <p class="teacher-eyebrow">Submissions</p>
    <h1>自校提出物確認</h1>
    <div class="teacher-table-scroll">
    <table border="1">
        <tr>
            <th>題名</th>
            <th>要約</th>
            <th>ダウンロード</th>
        </tr>
        {%for study in studies%}
        <tr>
            <td>{{study[1]}}</td>
            <td>{{study[2]}}</td>
            <td><a href="/uploads/{{study[4]}}">{{study[3]}}</a></td>
        </tr>
        {% endfor %}
    </table>
    </div>
    </section>
</div>
{% endblock %}
{% block script %}
{% endblock %}
