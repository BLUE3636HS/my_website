<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初回パスワード設定</title>
    <link rel="icon" href="/static/icon.ico">
    <link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body class="login-page">
    <main class="login-card">
        <p class="login-eyebrow">TEKNE</p>
        <h1>初回パスワード設定</h1>
        <p class="login-description">臨時パスワードでの初回ログインです。今後使用するパスワードを設定してください。</p>
        {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
        <form action="/admin/first-password" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="new_password">新しいパスワード</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required autofocus>
            <label for="confirm_password">新しいパスワード（確認）</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
            <p>12文字以上、UTF-8で72バイト以内で設定してください。</p>
            <button type="submit">パスワードを設定する</button>
        </form>
    </main>
</body>
</html>
