{% macro icon(name) -%}
<svg class="student-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
    {% if name == 'home' %}<path d="m3 10 9-7 9 7v10H3zM9 20v-6h6v6"/>
    {% elif name == 'add' %}<path d="M5 3h10l4 4v14H5zM12 10v7m-3.5-3.5h7"/>
    {% elif name == 'list' %}<path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"/>
    {% elif name == 'people' %}<circle cx="9" cy="7" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-16a3 3 0 0 1 0 6m1 3a5 5 0 0 1 4 5v2"/>
    {% elif name == 'chat' %}<path d="M21 4H3v13h5l4 4v-4h9zM7 9h10m-10 4h6"/>
    {% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h3"/>
    {% elif name == 'box' %}<path d="m3 7 9-4 9 4v10l-9 4-9-4zm0 0 9 4 9-4m-9 4v10"/>
    {% elif name == 'bell' %}<path d="M5 10a7 7 0 0 1 14 0v4l2 3H3l2-3zm4 10a3 3 0 0 0 6 0"/>
    {% elif name == 'user' %}<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 6 0 0 1 16 0v2"/>
    {% elif name == 'exit' %}<path d="M10 4H4v16h6m3-12 4 4-4 4m-5-4h13"/>
    {% endif %}
</svg>
{%- endmacro %}

{% macro nav_link(href, label, symbol, count=0) -%}
{% set path = request.url.path %}
<a class="student-nav-link" href="{{ href }}"{% if path == href or path.startswith(href ~ '/') %} aria-current="page"{% endif %}>
    {{ icon(symbol) }} <span>{{ label }}</span>
    {% if count %}<span class="notification-badge" aria-label="未読 {{ count }} 件">{{ count }}</span>{% endif %}
</a>
{%- endmacro %}
